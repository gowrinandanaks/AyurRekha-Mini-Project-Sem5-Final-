<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | AyurRekha</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f7f5ef; color: #1b3022; }
        .wrap { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 24px; }
        .card { width: 100%; max-width: 520px; background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
        h1 { margin: 0 0 12px; font-size: 1.5rem; }
        p { margin: 0 0 12px; color: #445; }
        label { display: block; margin-bottom: 6px; font-weight: 600; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #cfd5ce; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
        button { width: 100%; border: none; border-radius: 8px; padding: 11px 14px; background: #c5a059; color: #fff; font-weight: 700; cursor: pointer; }
        .errors { color: #a30000; margin: 0 0 12px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            {% if validlink %}
            <h1>Set a new password</h1>
            <form method="post">
                {% csrf_token %}
                {% if form.errors %}
                <div class="errors">{{ form.errors }}</div>
                {% endif %}
                <label for="id_new_password1">New password</label>
                <input type="password" name="new_password1" autocomplete="new-password" required id="id_new_password1">
                <label for="id_new_password2">Confirm new password</label>
                <input type="password" name="new_password2" autocomplete="new-password" required id="id_new_password2">
                <button type="submit">Reset password</button>
            </form>
            {% else %}
            <h1>Invalid reset link</h1>
            <p>This password reset link is invalid or has expired.</p>
            <p><a href="{% url 'password_reset' %}">Request a new reset link</a></p>
            {% endif %}
        </div>
    </div>
</body>
</html>
