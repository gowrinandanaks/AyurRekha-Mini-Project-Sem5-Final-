<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | AyurRekha</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f5ef;
            color: #1b3022;
        }
        .wrap {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 460px;
            background: #fff;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        h1 {
            margin: 0 0 10px;
            font-size: 1.6rem;
        }
        p {
            margin: 0 0 16px;
            color: #445;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cfd5ce;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 14px;
        }
        button {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 11px 14px;
            background: #c5a059;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }
        .back {
            display: block;
            margin-top: 12px;
            text-align: center;
            color: #1b3022;
            text-decoration: none;
            font-size: 14px;
        }
        .errors {
            color: #a30000;
            margin: 0 0 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <h1>Forgot your password?</h1>
            <p>Enter your account email and we will send a reset link.</p>
            <form method="post">
                {% csrf_token %}
                {% if form.errors %}
                <div class="errors">{{ form.email.errors }}</div>
                {% endif %}
                <label for="id_email">Email</label>
                <input type="email" name="email" autocomplete="email" required id="id_email">
                <button type="submit">Send reset link</button>
            </form>
            <a class="back" href="{% url 'home' %}">Back to home</a>
        </div>
    </div>
</body>
</html>
