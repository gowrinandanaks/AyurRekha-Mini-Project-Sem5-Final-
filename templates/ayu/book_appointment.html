<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Consultation - AyurRekha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --forest: #1B3022;
            --gold: #C5A059;
            --pearl: #FBFAF5;
            --soft-gray: #f2f2f2;
            --text: #333333;
            --white: #ffffff;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--pearl);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .booking-card {
            background: var(--white);
            width: 600px;
            max-width: 90%;
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            text-align: center;
        }

        .practitioner-mini {
            display: flex;
            align-items: center;
            gap: 20px;
            text-align: left;
            background: var(--soft-gray);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 30px;
        }

        .practitioner-mini .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--forest);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 1.5rem;
        }

        .practitioner-mini h3 {
            margin: 0;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            color: var(--forest);
        }

        .practitioner-mini p {
            margin: 0;
            font-size: 0.85rem;
            color: #888;
        }

        h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            color: var(--forest);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #777;
            margin-bottom: 40px;
        }

        form {
            text-align: left;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--forest);
        }

        input, textarea, select {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-family: 'Montserrat', sans-serif;
            background: #fafafa;
            transition: border-color 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--gold);
        }

        .btn-confirm {
            width: 100%;
            background: var(--forest);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        .btn-confirm:hover {
            background: var(--gold);
        }

        .back-link {
            display: block;
            margin-top: 25px;
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: var(--gold);
        }

        .date-time-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
    </style>
</head>
<body>

    <div class="booking-card">
        <h2>Schedule Consultation</h2>
        <p class="subtitle">Secure your session with our certified expert.</p>

        <div class="practitioner-mini">
            <div class="avatar">
                {% if practitioner.profile.profile_photo %}
                    <img src="{{ practitioner.profile.profile_photo.url }}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">
                {% else %}
                    <i class="fas fa-user-md"></i>
                {% endif %}
            </div>
            <div>
                <h3>Dr. {{ practitioner.username }}</h3>
                <p>{{ practitioner.profile.specialization }} • Expert in Healing</p>
            </div>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="date-time-grid">
                <div class="form-group">
                    <label>Preferred Date</label>
                    <input type="date" name="date" required min="{{ today|date:'Y-m-d' }}">
                </div>
                <div class="form-group">
                    <label>Preferred Time</label>
                    <input type="time" name="time" required>
                </div>
            </div>

            <div class="form-group">
                <label>Nature of Consultation (Optional)</label>
                <textarea name="notes" placeholder="Tell the doctor about your symptoms or concerns..." rows="4"></textarea>
            </div>

            <button type="submit" class="btn-confirm">Request Appointment</button>
        </form>

        <a href="{% url 'practitioner_directory' %}" class="back-link"><i class="fas fa-times"></i> Cancel Booking</a>
    </div>

</body>
</html>
