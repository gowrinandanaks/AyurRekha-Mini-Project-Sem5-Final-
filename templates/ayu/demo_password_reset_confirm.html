<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | AyurRekha</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f7f5ef; color: #1b3022; }
        .wrap { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 24px; }
        .card { width: 100%; max-width: 460px; background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); }
        h1 { margin: 0 0 10px; font-size: 1.6rem; }
        p { margin: 0 0 16px; color: #445; }
        label { display: block; margin-bottom: 6px; font-weight: 600; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #cfd5ce; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
        button { width: 100%; border: none; border-radius: 8px; padding: 11px 14px; background: #c5a059; color: #fff; font-weight: 700; cursor: pointer; }
        .back { display: block; margin-top: 12px; text-align: center; color: #1b3022; text-decoration: none; font-size: 14px; }
        .messages { margin-bottom: 15px; }
        .message { padding: 10px; border-radius: 5px; margin-bottom: 5px; }
        .message.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <h1>Set New Password</h1>
            <p>Resetting password for: <strong>{{ user_to_reset.email }}</strong></p>
            
            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <label for="id_password">New Password</label>
                <input type="password" name="password" required id="id_password" placeholder="Enter new password">
                
                <label for="id_confirm_password">Confirm New Password</label>
                <input type="password" name="confirm_password" required id="id_confirm_password" placeholder="Confirm new password">
                
                <button type="submit">Update Password</button>
            </form>
            <a class="back" href="{% url 'home' %}">Back to home</a>
        </div>
    </div>
</body>
</html>
